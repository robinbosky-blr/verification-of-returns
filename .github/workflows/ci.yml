name: Verify returns application
on: [push, pull_request]
permissions:
 contents: read
jobs:
 backend:
  runs-on: ubuntu-latest
  services:
   postgres:
    image: postgres:18.6-alpine
    env:
     POSTGRES_PASSWORD: test-password
     POSTGRES_DB: returns_test
    ports: [5432:5432]
    options: >-
     --health-cmd pg_isready
     --health-interval 5s
     --health-timeout 5s
     --health-retries 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with:
      go-version: '1.27.3'
      cache-dependency-path: backend/go.sum
   - run: go test -race ./...
     working-directory: backend
     env:
      TEST_DATABASE_URL: postgres://postgres:test-password@localhost:5432/returns_test?sslmode=disable
   - run: go vet ./...
     working-directory: backend
 frontend:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '24'
      cache: npm
      cache-dependency-path: web/package-lock.json
   - run: npm ci && npm run check && npm run build
     working-directory: web
