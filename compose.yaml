name: returns
services:
 db:
  image: postgres:18.6-alpine
  restart: unless-stopped
  environment:
   POSTGRES_DB: returns
   POSTGRES_USER: returns
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  volumes:
   - postgres:/var/lib/postgresql
  healthcheck:
   test: [CMD-SHELL, "pg_isready -U returns -d returns"]
   interval: 5s
   timeout: 5s
   retries: 20
 api:
  build: ./backend
  restart: unless-stopped
  command: [-mode, api]
  environment: &backend_env
   DATABASE_URL: postgres://returns:${POSTGRES_PASSWORD}@db:5432/returns?sslmode=disable
   ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
   COOKIE_SECURE: ${COOKIE_SECURE:-false}
   DATA_DIR: /data
   S3_ENDPOINT: ${S3_ENDPOINT:-}
   S3_BUCKET: ${S3_BUCKET:-}
   S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
   S3_SECRET_KEY: ${S3_SECRET_KEY:-}
   S3_SECURE: ${S3_SECURE:-true}
  depends_on:
   db:
    condition: service_healthy
  volumes: [uploads:/data]
  healthcheck:
   test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
   interval: 10s
   timeout: 5s
   retries: 10
 worker:
  build: ./backend
  restart: unless-stopped
  command: [-mode, worker]
  environment: *backend_env
  depends_on:
   api:
    condition: service_healthy
  volumes: [uploads:/data]
 web:
  build: ./web
  restart: unless-stopped
  ports: ["127.0.0.1:${HTTP_PORT:-8088}:80"]
  depends_on:
   api:
    condition: service_healthy
volumes:
 postgres:
 uploads:
